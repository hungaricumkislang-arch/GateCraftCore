ial({color:0x24282a,roughness:.95,metalness:.15}));floor.rotation.x=-Math.PI/2;scene.add(floor);let grid=new THREE.GridHelper(70,35,0x55311e,0x343a3e);grid.position.y=.02;scene.add(grid);for(let i=-26;i<=26;i+=8){box(1,5,1,0x593321,i,2.5,-22);box(1,5,1,0x593321,i,2.5,22)}for(let i=0;i<18;i++){let x=(Math.random()-.5)*50,z=(Math.random()-.5)*42;if(Math.abs(x)<5&&Math.abs(z)<5)continue;box(1+Math.random()*3,.5+Math.random()*2,1+Math.random()*3,Math.random()<.5?0x40342b:0x354049,x,.5,z)}window.addEventListener('resize',resize);resize()}function resize(){if(!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight,false)}function makePlayer(){if(player)scene.remove(player);player=new THREE.Group();let mat=new THREE.MeshStandardMaterial({color:selected.color,roughness:.6,metalness:.65}),body=new THREE.Mesh(new THREE.BoxGeometry(1.2,1.6,.8),mat);body.position.y=1.25;player.add(body);let head=new THREE.Mesh(new THREE.BoxGeometry(.75,.65,.72),new THREE.MeshStandardMaterial({color:0x30363a,metalness:.8}));head.position.y=2.38;player.add(head);let tool=new THREE.Mesh(new THREE.BoxGeometry(.25,.25,1.7),new THREE.MeshStandardMaterial({color:0xb9c2c8,metalness:1}));tool.position.set(.8,1.15,.25);tool.rotation.x=.3;player.add(tool);scene.add(player)}function spawnEnemy(kind){let g=new THREE.Group(),boss=kind==='boss',b=new THREE.Mesh(new THREE.BoxGeometry(boss?2.3:1.1,boss?2.8:1.4,boss?2:1),new THREE.MeshStandardMaterial({color:boss?0x8f1f1f:0x784c2c,metalness:.7,roughness:.65}));b.position.y=boss?1.4:.7;g.add(b);let eye=new THREE.PointLight(0xff3c1f,boss?10:3,4);eye.position.set(0,boss?2.2:1.1,.6);g.add(eye);let a=Math.random()*Math.PI*2,r=13+Math.random()*12;g.position.set(Math.cos(a)*r,0,Math.sin(a)*r);g.userData={hp:boss?420+state.zone*80:55+state.zone*12,speed:boss?1.5:1.4+Math.random(),boss};scene.add(g);enemies.push(g)}function startMission(rust){selected=CLASSES.find(x=>x.id===state.cls)||CLASSES[0];init3

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>
:root{--rust:#b95c2e;--steel:#7f919d;--panel:#11171dcc;--gold:#d5a64b;--danger:#a63a2d;--blue:#2f79a8}
*{box-sizing:border-box;touch-action:none;-webkit-user-select:none;user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050709;color:#edf1f3;font-family:Arial,Helvetica,sans-serif}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;background:#050709}
.hidden{display:none!important}.hud{position:absolute;inset:0;pointer-events:none}.ui{pointer-events:auto}
.topbar{position:absolute;left:10px;right:10px;top:8px;height:72px;display:flex;align-items:center;gap:10px;pointer-events:none}
.nameplate,.missionplate,.barbox{background:linear-gradient(#192129e8,#0d1217ee);border:2px solid #495760;border-radius:8px;box-shadow:0 3px 14px #000b,inset 0 0 0 1px #000;padding:7px 10px}
.nameplate{min-width:220px}.name{font-weight:900;color:#f0c56e;font-size:16px;letter-spacing:.6px}.sub{font-size:11px;color:#aebac2;margin-top:2px}
.bars{display:flex;flex-direction:column;gap:5px;min-width:235px}.bar{height:15px;background:#080a0c;border:1px solid #5c656b;border-radius:3px;overflow:hidden}.bar>i{display:block;height:100%;width:100%}.hpfill{background:linear-gradient(90deg,#8e1d18,#e34e39)}.enfill{background:linear-gradient(90deg,#154a72,#3aa6e3)}.xpfill{background:linear-gradient(90deg,#7b5b12,#e3c15c)}
.missionplate{margin-left:auto;max-width:300px;text-align:right}.missiontitle{font-weight:800;color:#f0c56e;font-size:13px}.missiontext{font-size:11px;color:#c4ccd1;margin-top:3px}
#exit{position:absolute;right:12px;top:88px;width:98px;height:42px}.btn{border:2px solid #697780;background:linear-gradient(#313a40,#171d21);color:#fff;border-radius:9px;font-weight:900;text-shadow:0 1px #000;box-shadow:0 4px 12px #0009,inset 0 0 0 1px #0b0d0f}.btn:active{transform:translateY(1px);filter:brightness(.9)}
#joy{position:absolute;left:20px;bottom:18px;width:156px;height:156px;border-radius:50%;background:#0d141ab8;border:3px solid #657985;box-shadow:inset 0 0 28px #000,0 4px 20px #000a}.joyring{position:absolute;inset:22px;border:1px solid #45555f;border-radius:50%}.knob{position:absolute;left:50px;top:50px;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b5c2c9,#62737d 55%,#303c43);border:3px solid #cbd4d9;box-shadow:0 3px 10px #000a}
.actions{position:absolute;right:18px;bottom:18px;width:310px;height:178px}.act{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;line-height:1.05;padding:4px}.attack{width:94px;height:94px;right:0;bottom:12px;background:radial-gradient(circle at 35% 25%,#d15742,#771c17 68%,#35100e)}.skill{width:78px;height:78px}.s1{right:102px;bottom:0;background:radial-gradient(circle,#b06b30,#553017)}.s2{right:112px;bottom:88px;background:radial-gradient(circle,#347ca9,#173c57)}.dash{right:198px;bottom:22px;background:radial-gradient(circle,#7554a8,#362650)}.interact{right:208px;bottom:105px;width:70px;height:70px;background:radial-gradient(circle,#558455,#263f27)}
.cool{position:absolute;inset:4px;border-radius:50%;border:3px solid #ffffff40;pointer-events:none}.label{pointer-events:none}
#minimap{position:absolute;right:14px;top:139px;width:150px;height:116px;background:#090d10d9;border:2px solid #55646d;border-radius:7px;box-shadow:0 3px 12px #000a}
#lootToast{position:absolute;left:50%;top:90px;transform:translateX(-50%);min-width:260px;max-width:70vw;padding:8px 14px;background:#0b1014e8;border:2px solid #777;border-radius:7px;text-align:center;font-weight:800;opacity:0;transition:opacity .18s;box-shadow:0 5px 20px #000b}.common{border-color:#bfc3c6!important;color:#e9ecee}.magic{border-color:#3f89e8!important;color:#7db5ff}.rare{border-color:#a64bd8!important;color:#cf8af2}.legend{border-color:#d9a931!important;color:#ffd56d}
#inventoryBtn{position:absolute;right:12px;top:266px;width:118px;height:42px}.drawer{position:absolute;right:10px;top:315px;width:min(360px,46vw);max-height:calc(100vh - 330px);overflow:auto;background:#0e1419ee;border:2px solid #5d6b73;border-radius:8px;padding:10px;box-shadow:0 6px 26px #000c;pointer-events:auto}.slot{padding:7px 8px;margin:5px 0;background:#151d23;border-left:5px solid #888;border-radius:4px;font-size:12px}.slot b{display:block;font-size:13px}.eq{color:#f0c56e}
.center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#18222bd9,#06080bee 65%);pointer-events:auto;padding:14px}.panel{width:min(950px,96vw);max-height:94vh;overflow:auto;background:linear-gradient(#151d23,#0b1014);border:2px solid #5d6a72;border-radius:12px;padding:18px;box-shadow:0 20px 80px #000,inset 0 0 0 1px #000}.title{font-size:30px;font-weight:900;color:#e5a052;letter-spacing:1.2px;text-shadow:0 2px #000}.subtitle{font-size:13px;color:#aeb8bf;margin-top:4px}.sectionTitle{font-size:16px;color:#f0c56e;margin:15px 0 7px;font-weight:900}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{padding:11px;border:2px solid #4d5960;background:linear-gradient(#1d272e,#11181d);border-radius:8px;cursor:pointer;min-height:112px}.card.sel{border-color:#e3a54e;box-shadow:0 0 0 1px #8c5d22,0 0 18px #bd6f2855}.card h3{margin:0 0 5px;color:#f0c56e;font-size:16px}.card p{margin:3px 0;color:#b5c0c7;font-size:12px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:11px}.big{min-height:46px;padding:10px 16px}.zone{min-height:94px}.zone strong{display:block;color:#e8c67d;margin-bottom:4px}.profilegrid{display:grid;grid-template-columns:1.1fr .9fr;gap:10px}.box{background:#0b1116;border:1px solid #4b5860;border-radius:7px;padding:10px;font-size:12px}.loadout{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.lootrow{padding:7px 9px;background:#11191f;border-left:5px solid #888;border-radius:4px;font-size:12px;cursor:pointer}.tiny{font-size:11px;color:#95a2aa}.gold{color:#e7bd5d}.danger{color:#ef735f}
@media(max-width:760px){.topbar{height:62px}.nameplate{min-width:170px}.bars{min-width:180px}.missionplate{max-width:220px}.name{font-size:13px}.sub,.missiontext{font-size:9px}#joy{width:138px;height:138px}.knob{left:44px;top:44px;width:50px;height:50px}.actions{transform:scale(.92);transform-origin:right bottom}.cards{grid-template-columns:1fr}.title{font-size:24px}.profilegrid{grid-template-columns:1fr}.panel{padding:12px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud hidden" id="hud">
  <div class="topbar">
    <div class="nameplate"><div class="name" id="heroName">GRIND & WELD</div><div class="sub" id="heroSub"></div></div>
    <div class="bars barbox">
      <div class="bar"><i class="hpfill" id="hpBar"></i></div>
      <div class="bar"><i class="enfill" id="enBar"></i></div>
      <div class="bar"><i class="xpfill" id="xpBar"></i></div>
    </div>
    <div class="missionplate"><div class="missiontitle" id="missionTitle"></div><div class="missiontext" id="missionText"></div></div>
  </div>
  <button class="btn ui" id="exit">EXIT</button>
  <canvas id="minimap" width="300" height="232"></canvas>
  <button class="btn ui" id="inventoryBtn">INVENTORY</button>
  <div class="drawer hidden" id="drawer"></div>
  <div class="ui" id="joy"><div class="joyring"></div><div class="knob" id="knob"></div></div>
  <div class="actions ui">
    <button class="btn act attack" id="atk"><span class="label">ATTACK</span></button>
    <button class="btn act skill s1" id="s1"><span class="label">SKILL 1</span></button>
    <button class="btn act skill s2" id="s2"><span class="label">SKILL 2</span></button>
    <button class="btn act skill dash" id="dash"><span class="label">DASH</span></button>
    <button class="btn act interact" id="interact"><span class="label">USE</span></button>
  </div>
  <div id="lootToast"></div>
</div>
<div class="center" id="menu">
  <div class="panel">
    <div class="title">GRIND & WELD: RUST & STEEL</div>
    <div class="subtitle" id="tagline"></div>
    <div id="classPage">
      <div class="sectionTitle" id="chooseTitle"></div>
      <div class="cards" id="classCards"></div>
      <div class="row"><button class="btn big" id="toWorkshop"></button></div>
    </div>
    <div id="workshopPage" class="hidden">
      <div class="profilegrid"><div class="box" id="profileBox"></div><div class="box" id="resourceBox"></div></div>
      <div class="sectionTitle" id="zoneTitle"></div>
      <div class="cards" id="zones"></div>
      <div class="sectionTitle" id="loadoutTitle"></div>
      <div class="loadout" id="loadout"></div>
      <div class="row"><button class="btn big" id="forgeBtn"></button><button class="btn big" id="healBtn"></button><button class="btn big" id="startBtn"></button></div>
      <div class="tiny" id="workshopTip"></div>
    </div>
  </div>
</div>
<script>/*__THREEJS__*/</script>
<script>/*__GAMEJS__*/</script>
</body></html>

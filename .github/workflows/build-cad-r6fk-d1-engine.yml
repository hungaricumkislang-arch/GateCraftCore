name: Build R6FK D1 CAD Engine

on:
  push:
    branches: [ cad-r6fk-r6am-debloat-d1 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Get MIT App Inventor extension template
        run: git clone --recurse-submodules https://github.com/mit-cml/extension-template.git buildenv

      - name: Install R6FK D1 engine source
        run: |
          rm -rf buildenv/src/*
          mkdir -p buildenv/src/com/gatecraft/cadengine
          cp cad_debloat/r6fk_d1/src/com/gatecraft/cadengine/GateCraftCADEngine.java buildenv/src/com/gatecraft/cadengine/
          python3 - <<'PY'
          from pathlib import Path
          p = Path('buildenv/src/com/gatecraft/cadengine/GateCraftCADEngine.java')
          s = p.read_text(encoding='utf-8')
          frags = [
            Path('cad_debloat/r6fk_d1/extra_r6ak_r6al_r6an.javafrag').read_text(encoding='utf-8'),
            Path('cad_debloat/r6fk_d1/extra_r6an_selected.javafrag').read_text(encoding='utf-8'),
          ]
          pos = s.rfind('}')
          if pos < 0:
              raise SystemExit('GateCraftCADEngine closing brace not found')
          p.write_text(s[:pos] + '\n' + '\n'.join(frags) + '\n' + s[pos:], encoding='utf-8')
          PY
          find buildenv/src -type f -print

      - name: Build AIX
        run: |
          cd buildenv
          ant clean extensions

      - name: Show outputs
        run: find buildenv/out -maxdepth 3 -type f -print

      - name: Upload AIX
        uses: actions/upload-artifact@v4
        with:
          name: GateCraftCADEngine-R6FK-D1
          path: buildenv/out/*.aix
          if-no-files-found: error

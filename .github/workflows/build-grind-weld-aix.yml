name: Build GRIND WELD v2.7 Asset Payload Canary

on:
  push:
    branches: [ grind-weld-v27-asset-payload ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GateCraftCore
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Get MIT App Inventor extension template
        run: git clone --recurse-submodules https://github.com/mit-cml/extension-template.git buildenv

      - name: Build compressed Three.js project asset
        run: |
          curl -L --fail --retry 3 https://cdnjs.cloudflare.com/ajax/libs/three.js/0.152.0/three.min.js -o /tmp/three.min.js
          python3 - <<'PY'
          import gzip, pathlib
          root=pathlib.Path('grind_weld_extension')
          html=(root/'game/grind_weld_web.html').read_text(encoding='utf-8')
          game=(root/'game/grind_weld_v2.js').read_text(encoding='utf-8')
          parts=[
              root/'game/campaign_patch.js',
              root/'game/campaign_hotfix.js',
              root/'game/world_v22.js',
              root/'game/world_v23.js',
              root/'game/world_v24.js',
              root/'game/world_v25.js',
              root/'game/world_v26.js',
              root/'game/world_v27.js',
          ]
          marker='function joyPoint(e){'
          assert marker in game
          addons='\n'.join(p.read_text(encoding='utf-8') for p in parts)
          game=game.replace(marker, addons+'\n'+marker, 1)
          pathlib.Path('/tmp/gw-game.js').write_text(game,encoding='utf-8')
          three=pathlib.Path('/tmp/three.min.js').read_text(encoding='utf-8')
          assert '/*__THREEJS__*/' in html and '/*__GAMEJS__*/' in html
          final=html.replace('/*__THREEJS__*/', three).replace('/*__GAMEJS__*/', game)
          raw=gzip.compress(final.encode('utf-8'), compresslevel=9)
          pathlib.Path('gatecraft_grindweld_payload.gz').write_bytes(raw)
          print('three',len(three.encode()),'game',len(game.encode()),'html',len(final.encode()),'gzip',len(raw))
          PY
          node --check /tmp/gw-game.js
          grep -q "GRIND & WELD v2.5" /tmp/gw-game.js
          grep -q "GRIND & WELD v2.6" /tmp/gw-game.js
          grep -q "GRIND & WELD v2.7" /tmp/gw-game.js
          grep -q "Rust Cathedral" /tmp/gw-game.js
          grep -q "Ashworks" /tmp/gw-game.js
          grep -q "Black Rail Yard" /tmp/gw-game.js
          grep -q "Iron Citadel" /tmp/gw-game.js

      - name: Install lightweight Grind Weld shell source
        run: |
          rm -f grind_weld_extension/src/com/gatecraft/grindweld/Payload.java
          rm -rf buildenv/src/*
          mkdir -p buildenv/src/com/gatecraft/grindweld
          cp grind_weld_extension/src/com/gatecraft/grindweld/GateCraftGrindWeld.java buildenv/src/com/gatecraft/grindweld/
          find buildenv/src -type f -print

      - name: Build GateCraftGrindWeld AIX shell
        run: |
          cd buildenv
          ant clean extensions

      - name: Show generated artifacts
        run: |
          find buildenv/out -maxdepth 2 -type f -print
          ls -l gatecraft_grindweld_payload.gz

      - name: Upload shell and payload asset
        uses: actions/upload-artifact@v4
        with:
          name: GateCraftGrindWeld-v2.7-asset-payload-aix
          path: |
            buildenv/out/*.aix
            gatecraft_grindweld_payload.gz
          if-no-files-found: error

name: Build MotorVision Phase2H isolated
on:
  push:
    branches: [ motorvision-phase2h-isolated ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
      - name: Resolve bundled ML Kit dependency graph
        run: |
          mkdir -p /tmp/mvdeps
          cat > /tmp/mvdeps/pom.xml <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.gatecraft</groupId><artifactId>motorvision-deps</artifactId><version>1</version>
            <repositories>
              <repository><id>google</id><url>https://dl.google.com/dl/android/maven2/</url></repository>
              <repository><id>central</id><url>https://repo.maven.apache.org/maven2/</url></repository>
            </repositories>
            <dependencyManagement><dependencies><dependency><groupId>androidx.lifecycle</groupId><artifactId>lifecycle-common</artifactId><version>2.5.1</version></dependency></dependencies></dependencyManagement>
            <dependencies>
              <dependency><groupId>com.google.mlkit</groupId><artifactId>text-recognition</artifactId><version>16.0.1</version><type>aar</type></dependency>
            </dependencies>
          </project>
          EOF
          cd /tmp/mvdeps
          mvn -B dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=deps
          mvn -B dependency:tree -Dscope=runtime -Dverbose -DoutputFile=/tmp/mvdeps/dependency-tree.txt
          ls -lh deps
          find deps -type f -print0 | sort -z | xargs -0 sha256sum > dependency-sha256.txt
      - name: Resolve App Inventor compatible Play Services candidate
        run: |
          rm -rf /tmp/mvcompat && mkdir -p /tmp/mvcompat
          cat > /tmp/mvcompat/pom.xml <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.gatecraft</groupId><artifactId>motorvision-compat</artifactId><version>1</version>
            <repositories>
              <repository><id>google</id><url>https://dl.google.com/dl/android/maven2/</url></repository>
              <repository><id>central</id><url>https://repo.maven.apache.org/maven2/</url></repository>
            </repositories>
            <dependencyManagement><dependencies>
              <dependency><groupId>com.google.android.gms</groupId><artifactId>play-services-base</artifactId><version>18.1.0</version><type>aar</type></dependency>
              <dependency><groupId>com.google.android.gms</groupId><artifactId>play-services-basement</artifactId><version>18.1.0</version><type>aar</type></dependency>
              <dependency><groupId>com.google.android.gms</groupId><artifactId>play-services-tasks</artifactId><version>18.0.2</version><type>aar</type></dependency>
              <dependency><groupId>androidx.lifecycle</groupId><artifactId>lifecycle-common</artifactId><version>2.5.1</version></dependency>
            </dependencies></dependencyManagement>
            <dependencies>
              <dependency><groupId>com.google.mlkit</groupId><artifactId>text-recognition</artifactId><version>16.0.1</version><type>aar</type></dependency>
            </dependencies>
          </project>
          EOF
          cd /tmp/mvcompat
          mvn -B dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=deps
          mvn -B dependency:tree -Dscope=runtime -Dverbose -DoutputFile=/tmp/mvcompat/dependency-tree.txt
          python3 - <<'PY'
          import zipfile,os
          out=[]
          needle=b'androidx/activity'
          for name in ['play-services-base-18.1.0.aar','play-services-basement-18.1.0.aar','play-services-tasks-18.0.2.aar']:
              p='/tmp/mvcompat/deps/'+name
              assert os.path.exists(p), p
              hits=[]
              with zipfile.ZipFile(p) as a:
                  cj=a.read('classes.jar')
              jar='/tmp/mvcompat/'+name.replace('.aar','-classes.jar')
              open(jar,'wb').write(cj)
              with zipfile.ZipFile(jar) as z:
                  for n in z.namelist():
                      if n.endswith('.class') and needle in z.read(n):
                          hits.append(n)
              out.append(name+' activity_refs='+str(len(hits))+'\n'+'\n'.join(hits[:50]))
          open('/tmp/mvcompat/activity-audit.txt','w').write('\n\n'.join(out))
          print('\n\n'.join(out))
          PY
      - name: Inspect extension-template dependency support
        run: |
          git clone --recurse-submodules https://github.com/mit-cml/extension-template.git /tmp/aitemplate
          grep -n 'lib/deps' /tmp/aitemplate/build.xml
          echo "Stock template javac/unjar pipeline is JAR-oriented; AAR contents require explicit preparation."
      - name: Audit ML Kit AAR payload
        run: |
          python3 - <<'PY'
          import zipfile, glob, os
          deps='/tmp/mvdeps/deps'
          critical=['text-recognition-16.0.1.aar','text-recognition-bundled-common-17.0.0.aar']
          for name in critical:
              p=os.path.join(deps,name)
              with zipfile.ZipFile(p) as z:
                  names=z.namelist()
                  assets=[x for x in names if x.startswith('assets/') and not x.endswith('/')]
                  jni=[x for x in names if x.startswith('jni/') and not x.endswith('/')]
                  print(name,'assets',len(assets),'jni',len(jni),'classes.jar',('classes.jar' in names))
                  if name.startswith('text-recognition-16'):
                      assert assets, 'bundled OCR model assets missing'
                  if name.startswith('text-recognition-bundled-common'):
                      abis=sorted({x.split('/')[1] for x in jni})
                      print('abis',abis)
                      assert abis==['arm64-v8a','armeabi-v7a','x86','x86_64']
          PY
      - name: Dependency gates
        run: |
          test -f /tmp/mvdeps/deps/text-recognition-16.0.1.aar
          test -f /tmp/mvdeps/deps/text-recognition-bundled-common-17.0.0.aar
          test -n "$(find /tmp/mvdeps/deps -type f | head -1)"
          # The bundled artifact legitimately has Google Play Services support libraries transitively.
          # Reject only the unbundled OCR as the ROOT dependency; verify root from the generated POM.
          grep -q '<artifactId>text-recognition</artifactId>' /tmp/mvdeps/pom.xml
          ! grep -q '<artifactId>play-services-mlkit-text-recognition</artifactId>' /tmp/mvdeps/pom.xml
          du -sh /tmp/mvdeps/deps
      - name: Audit AAR resource and manifest requirements
        run: |
          python3 - <<'PY'
          import zipfile,glob,os,re
          rows=[]
          for p in sorted(glob.glob('/tmp/mvdeps/deps/*.aar')):
              with zipfile.ZipFile(p) as z:
                  n=z.namelist()
                  res=[x for x in n if x.startswith('res/') and not x.endswith('/')]
                  manifest=z.read('AndroidManifest.xml') if 'AndroidManifest.xml' in n else b''
                  rows.append((os.path.basename(p),len(res),len(manifest),sum(1 for x in n if x.startswith('assets/') and not x.endswith('/')),sum(1 for x in n if x.startswith('jni/') and not x.endswith('/'))))
          print('AAR resource/manifest inventory')
          for r in rows:
              if r[1] or r[3] or r[4]: print(*r)
          print('AAR total',len(rows),'with_res',sum(r[1]>0 for r in rows),'with_manifest',sum(r[2]>0 for r in rows))
          assert len(rows)==53
          assert sum(r[1]>0 for r in rows)==17
          PY
      - name: Classify ML Kit manifest and resource coupling
        run: |
          python3 - <<'PY'
          import zipfile,glob,os,re
          critical=[]
          for p in sorted(glob.glob('/tmp/mvdeps/deps/*.aar')):
              with zipfile.ZipFile(p) as z:
                  names=z.namelist()
                  man=z.read('AndroidManifest.xml') if 'AndroidManifest.xml' in names else b''
                  # Binary AXML: preserve printable tokens for audit without pretending to merge it.
                  toks=sorted(set(x.decode('latin1','ignore') for x in re.findall(rb'[A-Za-z0-9_.$:/-]{4,}',man)))
                  interesting=[x for x in toks if any(k in x.lower() for k in ('provider','service','receiver','permission','mlkit','startup','component'))]
                  res=sum(1 for n in names if n.startswith('res/') and not n.endswith('/'))
                  if interesting or res:
                      critical.append((os.path.basename(p),res,interesting[:30]))
          for a,res,t in critical:
              print('COUPLING',a,'res',res,'manifest_tokens',t)
          open('/tmp/mvpayload-coupling.txt','w').write('\n'.join('%s res=%s %s'%(a,res,t) for a,res,t in critical))
          PY
      - name: Enforce offline manifest policy
        run: |
          python3 - <<'PY'
          import zipfile,glob,os,re
          offenders=[]
          runtime=[]
          for p in sorted(glob.glob('/tmp/mvdeps/deps/*.aar')):
              with zipfile.ZipFile(p) as z:
                  man=z.read('AndroidManifest.xml') if 'AndroidManifest.xml' in z.namelist() else b''
                  low=man.lower()
                  if b'android.permission.internet' in low or b'android.permission.access_network_state' in low:
                      offenders.append(os.path.basename(p))
                  if any(x in low for x in (b'mlkitinitprovider',b'mlkitcomponentdiscoveryservice',b'textregistrar',b'visioncommonregistrar')):
                      runtime.append(os.path.basename(p))
          print('NETWORK_MANIFEST_ARTIFACTS',offenders)
          print('MLKIT_RUNTIME_MANIFEST_ARTIFACTS',runtime)
          # Network-bearing transport manifests must never be merged into MotorVision.
          assert 'transport-backend-cct-2.3.3.aar' in offenders
          open('/tmp/motorvision-manifest-policy.txt','w').write(
              'DO_NOT_MERGE_NETWORK_MANIFESTS='+','.join(offenders)+'\nREQUIRED_MLKIT_RUNTIME_MANIFESTS='+','.join(runtime)+'\n')
          PY
      - name: Extract exact ML Kit runtime manifest tokens
        run: |
          python3 - <<'PY'
          import zipfile,glob,os,re
          targets=['common-18.11.0.aar','play-services-mlkit-text-recognition-common-19.1.0.aar','vision-common-17.3.0.aar','text-recognition-16.0.1.aar','text-recognition-bundled-common-17.0.0.aar']
          out=[]
          for name in targets:
              p='/tmp/mvdeps/deps/'+name
              with zipfile.ZipFile(p) as z:
                  b=z.read('AndroidManifest.xml')
                  toks=sorted(set(x.decode('latin1','ignore') for x in re.findall(rb'[A-Za-z0-9_.$:/=-]{3,}',b)))
                  keep=[x for x in toks if ('mlkit' in x.lower() or 'firebase.components' in x.lower() or 'provider' in x.lower() or 'service' in x.lower() or 'registrar' in x.lower())]
                  print('MANIFEST',name); print('\n'.join(keep))
                  out.append(name+'\n'+'\n'.join(keep))
          open('/tmp/motorvision-mlkit-manifest-tokens.txt','w').write('\n\n'.join(out))
          PY
      - name: Generate minimal offline manifest contract
        run: |
          cat > /tmp/MotorVision.offline-manifest.xml <<'XML'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application>
              <!-- MotorVision initializes ML Kit explicitly; no provider/applicationId placeholder required. -->
              <service android:name="com.google.mlkit.common.internal.MlKitComponentDiscoveryService" android:directBootAware="true" android:exported="false">
                <meta-data android:name="com.google.firebase.components:com.google.mlkit.common.internal.CommonComponentRegistrar" android:value="com.google.firebase.components.ComponentRegistrar" />
                <meta-data android:name="com.google.firebase.components:com.google.mlkit.vision.common.internal.VisionCommonRegistrar" android:value="com.google.firebase.components.ComponentRegistrar" />
                <meta-data android:name="com.google.firebase.components:com.google.mlkit.vision.text.internal.TextRegistrar" android:value="com.google.firebase.components.ComponentRegistrar" />
              </service>
              <meta-data android:name="com.google.mlkit.vision.DEPENDENCIES" android:value="ocr" />
            </application>
          </manifest>
          XML
          ! grep -Eqi 'INTERNET|ACCESS_NETWORK_STATE|CAMERA' /tmp/MotorVision.offline-manifest.xml
          ! grep -q 'MlKitInitProvider' /tmp/MotorVision.offline-manifest.xml
          grep -q 'TextRegistrar' /tmp/MotorVision.offline-manifest.xml
          grep -q 'VisionCommonRegistrar' /tmp/MotorVision.offline-manifest.xml
          grep -q 'CommonComponentRegistrar' /tmp/MotorVision.offline-manifest.xml
          cat /tmp/MotorVision.offline-manifest.xml
      - name: Prepare AAR payload map for AIX integration
        run: |
          rm -rf /tmp/mvpayload
          mkdir -p /tmp/mvpayload/jars /tmp/mvpayload/assets /tmp/mvpayload/jni
          python3 - <<'PY'
          import zipfile,glob,os,shutil,json
          deps='/tmp/mvdeps/deps'; out='/tmp/mvpayload'; manifest=[]
          for p in sorted(glob.glob(deps+'/*')):
              base=os.path.basename(p)
              if p.endswith('.jar'):
                  shutil.copy2(p,out+'/jars/'+base); manifest.append({'artifact':base,'kind':'jar'})
              elif p.endswith('.aar'):
                  with zipfile.ZipFile(p) as z:
                      names=z.namelist()
                      if 'classes.jar' in names:
                          target=base[:-4]+'__classes.jar'
                          open(out+'/jars/'+target,'wb').write(z.read('classes.jar'))
                      assets=[n for n in names if n.startswith('assets/') and not n.endswith('/')]
                      jnis=[n for n in names if n.startswith('jni/') and not n.endswith('/')]
                      for n in assets:
                          dst=os.path.join(out,n); os.makedirs(os.path.dirname(dst),exist_ok=True); open(dst,'wb').write(z.read(n))
                      for n in jnis:
                          dst=os.path.join(out,n); os.makedirs(os.path.dirname(dst),exist_ok=True); open(dst,'wb').write(z.read(n))
                      manifest.append({'artifact':base,'kind':'aar','classes':('classes.jar' in names),'assets':len(assets),'jni':len(jnis),'resources':any(n.startswith('res/') for n in names),'manifest':('AndroidManifest.xml' in names)})
          open(out+'/payload-map.json','w').write(json.dumps(manifest,indent=2))
          print('jars',len(glob.glob(out+'/jars/*')),'assets',len(glob.glob(out+'/assets/**/*',recursive=True)),'jni',len(glob.glob(out+'/jni/**/*',recursive=True)))
          PY
          python3 - <<'PY'
          import os,glob
          assets=[p for p in glob.glob('/tmp/mvpayload/assets/**/*',recursive=True) if os.path.isfile(p)]
          jni=[p for p in glob.glob('/tmp/mvpayload/jni/**/*',recursive=True) if os.path.isfile(p)]
          latin=[p for p in assets if 'latin' in p.lower()]
          arm64=[p for p in jni if '/arm64-v8a/' in p]
          print('latin assets',len(latin)); print('\n'.join(latin[:20]))
          print('arm64 libs',len(arm64)); print('\n'.join(arm64))
          assert latin, 'No Latin OCR model asset found'
          assert arm64, 'No arm64-v8a native library found'
          PY
          du -sh /tmp/mvpayload
      - name: Build sanitized offline OCR runtime AAR
        run: |
          rm -rf /tmp/mvruntime
          mkdir -p /tmp/mvruntime/compile-jars /tmp/mvruntime/aar/assets /tmp/mvruntime/aar/jni /tmp/mvruntime/merged
          python3 - <<'PY'
          import zipfile,glob,os,io,shutil,hashlib,json
          deps='/tmp/mvcompat/deps'
          compile_dir='/tmp/mvruntime/compile-jars'
          selected=[
            'play-services-base-18.1.0.aar',
            'play-services-basement-18.1.0.aar',
            'play-services-tasks-18.0.2.aar',
            'play-services-mlkit-text-recognition-19.0.1.aar',
            'play-services-mlkit-text-recognition-common-19.1.0.aar',
            'image-1.0.0-beta1.aar',
            'vision-interfaces-16.3.0.aar',
            'common-18.11.0.aar',
            'transport-api-2.2.1.aar',
            'transport-backend-cct-2.3.3.aar',
            'transport-runtime-2.2.6.aar',
            'javax.inject-1.jar',
            'firebase-components-16.1.0.aar',
            'firebase-annotations-16.0.0.jar',
            'firebase-encoders-16.1.0.jar',
            'firebase-encoders-json-17.1.0.aar',
            'text-recognition-16.0.1.aar',
            'text-recognition-bundled-common-17.0.0.aar',
            'vision-common-17.3.0.aar',
            'exifinterface-1.0.0.aar',
          ]
          for n in selected:
              assert os.path.exists(os.path.join(deps,n)), n

          # Full resolved graph is compile-only. It is NOT automatically packaged into the extension.
          for p in sorted(glob.glob(deps+'/*')):
              b=os.path.basename(p)
              if p.endswith('.jar'):
                  shutil.copy2(p,os.path.join(compile_dir,b))
              elif p.endswith('.aar'):
                  with zipfile.ZipFile(p) as z:
                      if 'classes.jar' in z.namelist():
                          open(os.path.join(compile_dir,b[:-4]+'__classes.jar'),'wb').write(z.read('classes.jar'))

          entries={}
          owners={}
          class_conflicts=[]
          asset_count=0
          native_abis=set()
          for n in selected:
              p=os.path.join(deps,n)
              jars=[]
              if n.endswith('.jar'):
                  jars=[(n,open(p,'rb').read())]
              else:
                  with zipfile.ZipFile(p) as a:
                      if 'classes.jar' in a.namelist():
                          jars=[(n+'!classes.jar',a.read('classes.jar'))]
                      for e in a.namelist():
                          if e.startswith('assets/') and not e.endswith('/'):
                              data=a.read(e)
                              dst='/tmp/mvruntime/aar/'+e
                              os.makedirs(os.path.dirname(dst),exist_ok=True)
                              if not os.path.exists(dst):
                                  open(dst,'wb').write(data); asset_count+=1
                          if e.startswith('jni/') and e.endswith('.so'):
                              parts=e.split('/')
                              if len(parts)>=3 and parts[1] in ('arm64-v8a','armeabi-v7a'):
                                  data=a.read(e)
                                  dst='/tmp/mvruntime/aar/'+e
                                  os.makedirs(os.path.dirname(dst),exist_ok=True)
                                  if not os.path.exists(dst):
                                      open(dst,'wb').write(data)
                                  native_abis.add(parts[1])
              for owner,jb in jars:
                  with zipfile.ZipFile(io.BytesIO(jb)) as z:
                      for e in z.namelist():
                          if e.endswith('/') or e.upper().startswith('META-INF/'):
                              continue
                          data=z.read(e)
                          if e in entries:
                              if entries[e]!=data and e.endswith('.class'):
                                  class_conflicts.append((e,owners[e],owner))
                              continue
                          entries[e]=data; owners[e]=owner

          assert not class_conflicts, class_conflicts[:20]
          assert asset_count>0, 'OCR model assets missing'
          assert native_abis=={'arm64-v8a','armeabi-v7a'}, native_abis
          packaged_androidx=sorted(x for x in entries if x.startswith('androidx/'))
          assert all(x.startswith('androidx/exifinterface/') for x in packaged_androidx), packaged_androidx[:20]
          assert not any(x.startswith('kotlin/') for x in entries), 'Kotlin runtime must not be bundled'
          activity_refs=[n for n,d in entries.items() if n.endswith('.class') and b'androidx/activity' in d]
          assert not activity_refs, activity_refs[:20]

          classes='/tmp/mvruntime/aar/classes.jar'
          with zipfile.ZipFile(classes,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for n in sorted(entries):
                  z.writestr(n,entries[n])

          manifest='''<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.gatecraft.motorvision.ocr.runtime"><application /></manifest>'''
          open('/tmp/mvruntime/aar/AndroidManifest.xml','w').write(manifest)
          runtime='/tmp/mvruntime/motorvision-ocr-runtime.aar'
          with zipfile.ZipFile(runtime,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for root,dirs,files in os.walk('/tmp/mvruntime/aar'):
                  for f in files:
                      p=os.path.join(root,f); arc=os.path.relpath(p,'/tmp/mvruntime/aar')
                      z.write(p,arc)
          info={
            'selected':selected,
            'merged_entries':len(entries),
            'merged_classes':sum(1 for x in entries if x.endswith('.class')),
            'assets':asset_count,
            'abis':sorted(native_abis),
            'aar_bytes':os.path.getsize(runtime),
            'sha256':hashlib.sha256(open(runtime,'rb').read()).hexdigest(),
            'androidx_activity_refs':len(activity_refs),
          }
          open('/tmp/mvruntime/runtime-audit.json','w').write(json.dumps(info,indent=2))
          print(json.dumps(info,indent=2))
          PY
          unzip -t /tmp/mvruntime/motorvision-ocr-runtime.aar
          unzip -l /tmp/mvruntime/motorvision-ocr-runtime.aar > /tmp/mvruntime/runtime-list.txt
          ! unzip -p /tmp/mvruntime/motorvision-ocr-runtime.aar AndroidManifest.xml | grep -Eqi 'INTERNET|ACCESS_NETWORK_STATE|CAMERA|MlKitInitProvider'
          test -n "$(unzip -l /tmp/mvruntime/motorvision-ocr-runtime.aar | grep 'assets/mlkit-google-ocr-models/' | head -1)"
          test -n "$(unzip -l /tmp/mvruntime/motorvision-ocr-runtime.aar | grep 'jni/arm64-v8a/libmlkit_google_ocr_pipeline.so')"
          test -n "$(unzip -l /tmp/mvruntime/motorvision-ocr-runtime.aar | grep 'jni/armeabi-v7a/libmlkit_google_ocr_pipeline.so')"
          ! unzip -l /tmp/mvruntime/motorvision-ocr-runtime.aar | grep -q 'jni/x86'
      - name: Audit OCR runtime references against App Inventor support set
        run: |
          python3 - <<'PY'
          import zipfile,glob,os,re,io,json
          available=set()
          def add_jar_bytes(data):
              with zipfile.ZipFile(io.BytesIO(data)) as z:
                  for n in z.namelist():
                      if n.endswith('.class'):
                          available.add(n[:-6])
          for p in glob.glob('/tmp/aitemplate/lib/appinventor/*.jar'):
              try:
                  with zipfile.ZipFile(p) as z:
                      for n in z.namelist():
                          if n.endswith('.class'):
                              available.add(n[:-6])
              except zipfile.BadZipFile:
                  pass
          for p in glob.glob('/tmp/aitemplate/lib/appinventor/*.aar'):
              try:
                  with zipfile.ZipFile(p) as a:
                      if 'classes.jar' in a.namelist():
                          add_jar_bytes(a.read('classes.jar'))
              except zipfile.BadZipFile:
                  pass
          runtime='/tmp/mvruntime/aar/classes.jar'
          with zipfile.ZipFile(runtime) as z:
              runtime_classes={n[:-6] for n in z.namelist() if n.endswith('.class')}
              available.update(runtime_classes)
              refs=set()
              pat=re.compile(rb'(?:androidx|kotlin)/[A-Za-z0-9_$/]+')
              for n in z.namelist():
                  if n.endswith('.class'):
                      for m in pat.findall(z.read(n)):
                          refs.add(m.decode('ascii','ignore'))
          missing=sorted(x for x in refs if x not in available and not x.startswith('androidx/annotation/'))
          report={'support_refs':len(refs),'runtime_classes':len(runtime_classes),'missing':missing}
          open('/tmp/mvruntime/support-reference-audit.json','w').write(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          assert not missing, missing[:50]
          PY
      - name: Compile isolated OCR bridge against resolved payload
        run: |
          ANDROID_JAR=$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -1)
          test -f "$ANDROID_JAR"
          CP="$ANDROID_JAR:$(find /tmp/mvruntime/compile-jars -type f -name '*.jar' | sort | paste -sd: -)"
          rm -rf /tmp/mvclasses && mkdir -p /tmp/mvclasses
          javac -source 8 -target 8 -cp "$CP" -d /tmp/mvclasses motorvision_phase2h/src/com/gatecraft/motorvision/MotorVisionMlKitOcr.java
          test -f /tmp/mvclasses/com/gatecraft/motorvision/MotorVisionMlKitOcr.class
          javap -classpath "/tmp/mvclasses:$CP" com.gatecraft.motorvision.MotorVisionMlKitOcr > /tmp/motorvision-bridge-javap.txt
          grep -q 'recognize(java.lang.String' /tmp/motorvision-bridge-javap.txt
          echo "OCR_BRIDGE_COMPILE_PASS"
      - name: Build isolated MotorVision AIX with extension-template
        run: |
          rm -rf /tmp/mvaix
          cp -a /tmp/aitemplate /tmp/mvaix
          find /tmp/mvaix/src -type f -delete || true
          mkdir -p /tmp/mvaix/src/com/gatecraft/motorvision /tmp/mvaix/lib/deps
          echo '' | base64 -d > /tmp/phase2e-src.tgz
          tar xzf /tmp/phase2e-src.tgz -C /tmp/mvaix/src
          test "$(sha256sum /tmp/mvaix/src/com/gatecraft/motorvision/GateCraftMotorVision.java | cut -d' ' -f1)" = "7582aeadf765e456b240bedcc1a33d786b149172434e9c32597e753a7f81d2d5"
          test "$(sha256sum /tmp/mvaix/src/com/gatecraft/motorvision/MotorVisionMatcherCore.java | cut -d' ' -f1)" = "3defa2c2bd4c37b74bfd035af5c26881d99772e8f66d22d2d946aa51ab98b526"
          test "$(sha256sum /tmp/mvaix/src/com/gatecraft/motorvision/MiniJson.java | cut -d' ' -f1)" = "2c2e0981db7f93a5e693ff2f8f7360b434e682cb8ef68abfca4e88d907515fdb"
          test "$(sha256sum /tmp/mvaix/src/com/gatecraft/motorvision/MotorVisionOcrText.java | cut -d' ' -f1)" = "1632bdd1e47be10b34de4e566357fe7439bdc6ce4e80503376d2935398fee986"
          test "$(sha256sum /tmp/mvaix/src/com/gatecraft/motorvision/MotorVisionTexts.java | cut -d' ' -f1)" = "51c672e22de2f64db0d6eb343ddaba1db76add9fe373c0ca7938c7455961ccd4"
          cp motorvision_phase2h/phase2n/GateCraftMotorVision.java /tmp/mvaix/src/com/gatecraft/motorvision/GateCraftMotorVision.java
          cp motorvision_phase2h/src/com/gatecraft/motorvision/MotorVisionMlKitOcr.java /tmp/mvaix/src/com/gatecraft/motorvision/
          cp /tmp/mvruntime/compile-jars/*.jar /tmp/mvaix/lib/deps/
          cp /tmp/mvruntime/motorvision-ocr-runtime.aar /tmp/mvaix/lib/deps/
          cd /tmp/mvaix
          ant extensions
          find . -type f -name '*.aix' -print
          AIX=$(find . -type f -name '*.aix' | head -1)
          test -n "$AIX"
          cp "$AIX" /tmp/GateCraftMotorVision_PHASE2N_ISOLATED.aix
          unzip -t /tmp/GateCraftMotorVision_PHASE2N_ISOLATED.aix
          unzip -l /tmp/GateCraftMotorVision_PHASE2N_ISOLATED.aix > /tmp/motorvision-aix-list.txt
      - name: Finalize Phase2N AIX package contract
        run: |
          python3 - <<'PY'
          import zipfile,json,os,tempfile,shutil
          src='/tmp/GateCraftMotorVision_PHASE2N_ISOLATED.aix'
          runtime='/tmp/mvruntime/motorvision-ocr-runtime.aar'
          work='/tmp/mvfinal'
          shutil.rmtree(work,ignore_errors=True)
          os.makedirs(work)
          with zipfile.ZipFile(src) as z:
              z.extractall(work)
          roots=[x for x in os.listdir(work) if os.path.isdir(os.path.join(work,x))]
          assert roots==['com.gatecraft.motorvision'], roots
          root=os.path.join(work,roots[0])
          os.makedirs(os.path.join(root,'aars'),exist_ok=True)
          shutil.copy2(runtime,os.path.join(root,'aars','motorvision-ocr-runtime.aar'))

          service=(
            '    <service android:name="com.google.mlkit.common.internal.MlKitComponentDiscoveryService" '
            'android:directBootAware="true" android:exported="false">\n'
            '      <meta-data android:name="com.google.firebase.components:com.google.mlkit.common.internal.CommonComponentRegistrar" '
            'android:value="com.google.firebase.components.ComponentRegistrar"/>\n'
            '      <meta-data android:name="com.google.firebase.components:com.google.mlkit.vision.common.internal.VisionCommonRegistrar" '
            'android:value="com.google.firebase.components.ComponentRegistrar"/>\n'
            '      <meta-data android:name="com.google.firebase.components:com.google.mlkit.vision.text.internal.TextRegistrar" '
            'android:value="com.google.firebase.components.ComponentRegistrar"/>\n'
            '    </service>\n'
          )
          metadata='      <meta-data android:name="com.google.mlkit.vision.DEPENDENCIES" android:value="ocr"/>\n'

          for name in ['component_build_info.json','component_build_infos.json']:
              p=os.path.join(root,'files',name)
              obj=json.load(open(p,encoding='utf-8'))
              rows=obj if isinstance(obj,list) else [obj]
              assert len(rows)==1, (name,len(rows))
              row=rows[0]
              row['libraries']=['motorvision-ocr-runtime.aar']
              row['permissions']=[]
              row['services']=[service]
              row['metadata']=[metadata]
              out=rows if isinstance(obj,list) else row
              with open(p,'w',encoding='utf-8',newline='\n') as f:
                  json.dump(out,f,ensure_ascii=False,separators=(',',':'))
          tmp=src+'.new'
          with zipfile.ZipFile(tmp,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for base,dirs,files in os.walk(work):
                  for f in sorted(files):
                      p=os.path.join(base,f)
                      z.write(p,os.path.relpath(p,work))
          os.replace(tmp,src)
          PY
          unzip -t /tmp/GateCraftMotorVision_PHASE2N_ISOLATED.aix
          unzip -l /tmp/GateCraftMotorVision_PHASE2N_ISOLATED.aix > /tmp/motorvision-aix-list.txt
      - name: Audit Phase2N AIX contract
        run: |
          rm -rf /tmp/mvaudit && mkdir -p /tmp/mvaudit
          unzip -q /tmp/GateCraftMotorVision_PHASE2N_ISOLATED.aix -d /tmp/mvaudit
          python3 - <<'PY'
          import json,glob,os,zipfile,hashlib
          root=glob.glob('/tmp/mvaudit/*')[0]
          comp=json.load(open(os.path.join(root,'components.json')))[0]
          build=json.load(open(os.path.join(root,'files','component_build_infos.json')))[0]
          methods={x['name'] for x in comp.get('methods',[])}
          events={x['name']:len(x.get('params',[])) for x in comp.get('events',[])}
          old={'BestControllerId','BestScore','CleanOcrText','ControllerCount','DatabaseVersion','IdentifyFromOcrText','IdentifyFromText','IndexLoaded','LanguageCode','LanguageIndex','LastError','LoadControllerIndex','NormalizeText','Schema','SetLanguageCode','SetLanguageIndex','SetTheme','Theme','ThemeBackButtonImage','ThemeBackgroundImage','ThemeButtonImage','ThemeTextColor','TopMatchesJson','UiText','Version'}
          assert old.issubset(methods), sorted(old-methods)
          assert {'RecognizeImage','RecognizeAndIdentifyImage','LoadControllerIndexAsset','LoadDefaultControllerIndex','MatchCount','TopMatchIdList','TopMatchDisplayList','OcrBusy','CloseOcr'}.issubset(methods)
          assert events.get('OcrRecognized')==2, events
          assert events.get('OcrFailed')==1, events
          assert events.get('ImageIdentified')==5, events
          assert events.get('ImageIdentifyFailed')==1, events
          assert build.get('libraries')==['motorvision-ocr-runtime.aar'], build.get('libraries')
          assert not build.get('permissions'), build.get('permissions')
          services='\n'.join(build.get('services',[]))
          metadata='\n'.join(build.get('metadata',[]))
          assert 'MlKitComponentDiscoveryService' in services
          assert 'TextRegistrar' in services and 'VisionCommonRegistrar' in services and 'CommonComponentRegistrar' in services
          assert 'com.google.mlkit.vision.DEPENDENCIES' in metadata and 'ocr' in metadata
          assert 'INTERNET' not in services+metadata and 'CAMERA' not in services+metadata
          aars=glob.glob(os.path.join(root,'aars','motorvision-ocr-runtime.aar'))
          assert len(aars)==1,aars
          aar=aars[0]
          with zipfile.ZipFile(aar) as z:
              names=z.namelist()
              assert any(x.startswith('assets/mlkit-google-ocr-models/') for x in names)
              assert 'jni/arm64-v8a/libmlkit_google_ocr_pipeline.so' in names
              assert 'jni/armeabi-v7a/libmlkit_google_ocr_pipeline.so' in names
              assert not any(x.startswith('jni/x86') for x in names)
              assert 'classes.jar' in names
          size=os.path.getsize('/tmp/GateCraftMotorVision_PHASE2N_ISOLATED.aix')
          assert size>1000000,size
          report={'aix_bytes':size,'methods':len(methods),'events':events,'libraries':build.get('libraries'),'services':build.get('services'),'metadata':build.get('metadata'),'sha256':hashlib.sha256(open('/tmp/GateCraftMotorVision_PHASE2N_ISOLATED.aix','rb').read()).hexdigest()}
          open('/tmp/motorvision-phase2n-audit.json','w').write(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY

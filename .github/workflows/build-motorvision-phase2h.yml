name: Build MotorVision Phase2H isolated
on:
  push:
    branches: [ motorvision-phase2h-isolated ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve-and-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Resolve bundled ML Kit dependency graph
        run: |
          mkdir -p /tmp/mvdeps
          cat > /tmp/mvdeps/pom.xml <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0"><modelVersion>4.0.0</modelVersion>
          <groupId>com.gatecraft</groupId><artifactId>motorvision-deps</artifactId><version>1</version>
          <dependencies><dependency><groupId>com.google.mlkit</groupId><artifactId>text-recognition</artifactId><version>16.0.1</version></dependency></dependencies>
          </project>
          EOF
          cd /tmp/mvdeps
          mvn -B dependency:copy-dependencies -DincludeScope=runtime -DoutputDirectory=deps
          ls -lh deps
          find deps -type f -print0 | sort -z | xargs -0 sha256sum > dependency-sha256.txt
      - name: Guard against unbundled OCR artifact
        run: |
          ! grep -R "play-services-mlkit-text-recognition" /tmp/mvdeps/dependency-sha256.txt
          test -n "$(find /tmp/mvdeps/deps -type f | head -1)"
      - uses: actions/upload-artifact@v4
        with:
          name: MotorVision-Phase2H-resolved-dependencies
          path: |
            /tmp/mvdeps/deps/*
            /tmp/mvdeps/dependency-sha256.txt
          if-no-files-found: error

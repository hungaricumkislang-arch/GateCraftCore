name: Build GateCraftGame Suite v5 Arcade Depth AIX Canary

on:
  push:
    branches: [ game-suite-v5-arcade-depth ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GateCraftCore
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Get MIT App Inventor extension template
        run: git clone --recurse-submodules https://github.com/mit-cml/extension-template.git buildenv

      - name: Install isolated arcade source
        run: |
          rm -rf buildenv/src/*
          cp -R game_extension/src/* buildenv/src/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('buildenv/src/com/gatecraft/game/HeroesCraftV5View.java')
          s=p.read_text(encoding='utf-8')
          old='endTurn=new RectF(700,348,944,410)'
          new='endTurn=new RectF(34,454,210,514)'
          assert old in s
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          find buildenv/src -type f -print

      - name: Build GateCraftGame v5 AIX
        run: |
          cd buildenv
          ant clean extensions

      - name: Show generated artifacts
        run: find buildenv/out -maxdepth 2 -type f -print

      - name: Upload GateCraftGame v5 AIX
        uses: actions/upload-artifact@v4
        with:
          name: GateCraftGame-v5.0-arcade-depth-aix
          path: buildenv/out/*.aix
          if-no-files-found: error

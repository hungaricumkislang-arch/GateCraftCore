name: Build GateCraftGame Suite v4 Arcade Reboot AIX Canary

on:
  push:
    branches: [ game-suite-v4-arcade-reboot ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GateCraftCore
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Get MIT App Inventor extension template
        run: git clone --recurse-submodules https://github.com/mit-cml/extension-template.git buildenv

      - name: Install isolated arcade source
        run: |
          rm -rf buildenv/src/*
          cp -R game_extension/src/* buildenv/src/
          find buildenv/src -type f -print

      - name: Build GateCraftGame v4 AIX
        run: |
          cd buildenv
          ant clean extensions

      - name: Show generated artifacts
        run: find buildenv/out -maxdepth 2 -type f -print

      - name: Upload GateCraftGame v4 AIX
        uses: actions/upload-artifact@v4
        with:
          name: GateCraftGame-v4.0-arcade-reboot-aix
          path: buildenv/out/*.aix
          if-no-files-found: error

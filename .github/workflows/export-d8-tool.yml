name: Export exact D8 9.4.17
on:
  push:
    branches: [ tmp-unused ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download exact R8/D8 9.4.17
        run: |
          mkdir -p /tmp/d8exact
          curl -L --fail --retry 3 -o /tmp/d8exact/r8.jar https://storage.googleapis.com/r8-releases/raw/9.4.17/r8.jar
          java -cp /tmp/d8exact/r8.jar com.android.tools.r8.D8 --version
          sha256sum /tmp/d8exact/r8.jar
      - uses: actions/upload-artifact@v4
        with:
          name: d8-9.4.17-exact
          path: /tmp/d8exact/r8.jar
          if-no-files-found: error

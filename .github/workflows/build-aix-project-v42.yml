name: Build GateCraftCore compat41

on:
  push:
    branches: [ gatecraft-project-v42-compat41-hotfix284 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GateCraftCore
        uses: actions/checkout@v4
      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant
      - name: Get official MIT App Inventor extension template
        run: git clone --recurse-submodules https://github.com/mit-cml/extension-template.git buildenv
      - name: Restore GateCraftCore source bundle
        run: |
          rm -rf buildenv/src/*
          cat source_bundle/part*.txt | base64 --decode > /tmp/gatecraftcore-src.tar.gz
          tar -xzf /tmp/gatecraftcore-src.tar.gz -C buildenv/src
      - name: Inject runtime with v41 editor compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          matches = list(Path('buildenv/src').rglob('GateCraftCore.java'))
          if len(matches) != 1:
              raise SystemExit('Expected exactly one GateCraftCore.java, found %d' % len(matches))
          p = matches[0]
          s = p.read_text(encoding='utf-8')
          s = s.replace('version = 10', 'version = 41', 1)
          s = s.replace('return "1.0.0";', 'return "4.1.0";', 1)
          fragments = []
          for fp in [
              'extra_methods.javafrag', 'extra_names.javafrag', 'extra_algorithms.javafrag',
              'extra_railing.javafrag', 'extra_welding.javafrag', 'extra_defaults.javafrag',
              'extra_geo_missing3d.javafrag', 'extra_batch.javafrag', 'extra_lang_asset.javafrag',
              'extra_static_asset.javafrag', 'extra_textops_asset.javafrag', 'extra_langplan_asset.javafrag',
              'extra_motordiag.javafrag', 'extra_motordiag_userdata.javafrag', 'extra_motordiag_lang.javafrag',
              'extra_techguide.javafrag', 'extra_techguide_display.javafrag', 'extra_stairpro.javafrag',
              'extra_stairpro_display.javafrag', 'extra_namedbatch.javafrag', 'extra_platform.javafrag',
              'extra_backup.javafrag', 'extra_backup_lang.javafrag', 'extra_backup_ui.javafrag',
              'extra_v33_ui.javafrag', 'extra_techguide_v2.javafrag', 'extra_projecthub.javafrag',
              'extra_v33_runtime.javafrag', 'extra_v33_screen1_lang.javafrag',
              'extra_business.javafrag', 'extra_calcfix_v36.javafrag',
              'extra_center_native_v38_01.javafrag', 'extra_center_native_v38_02.javafrag',
              'extra_center_native_v38_03.javafrag', 'extra_center_native_v38_04.javafrag',
              'extra_center_native_v38_05.javafrag', 'extra_ui_v38.javafrag',
              'extra_release_v40.javafrag', 'extra_fullfix_v41.javafrag',
              'extra_projecthub_v42.javafrag', 'extra_projecthub_v42_ui.javafrag',
              'extra_hotfix284.javafrag']:
              fragments.append(Path(fp).read_text(encoding='utf-8'))
          pos = s.rfind('}')
          if pos < 0:
              raise SystemExit('Could not locate class closing brace')
          s = s[:pos] + '\n' + '\n'.join(fragments) + '\n' + s[pos:]
          old = '''  public void PlatformApplyCurrentUi() {\n    String theme = gcPlatformString(gcPlatformTinyGet("kozos_tema", "default"), "default");\n    PlatformApplyThemeCode(theme);\n    PlatformApplyModernFourTheme();\n  }'''
          new = '''  public void PlatformApplyCurrentUi() {\n    String theme = gcPlatformString(gcPlatformTinyGet("kozos_tema", "default"), "default");\n    PlatformApplyThemeCode(theme);\n    PlatformApplyModernFourTheme();\n    gcV38ApplyModernExtras();\n    ProjectV2ApplyCurrentScreenUi();\n    gc284KeepProjectBarsWhite();\n  }'''
          if old not in s: raise SystemExit('PlatformApplyCurrentUi pattern missing')
          s = s.replace(old, new, 1)
          old2 = '''  public void PlatformPrepareScreen1Ui() {\n    String code = gcPlatformString(gcPlatformTinyGet("kozos_tema", "default"), "default");\n    int index = gcPlatformThemeIndex(code);\n    if (index < 1 || index > 4) {\n      gcPlatformTinyPut("kozos_tema", "default");\n    }\n    PlatformConfigureFourThemeSelectors();\n  }'''
          new2 = '''  public void PlatformPrepareScreen1Ui() {\n    String code = gcPlatformString(gcPlatformTinyGet("kozos_tema", "default"), "default");\n    int index = gcPlatformThemeIndex(code);\n    if (index < 1 || index > 4) {\n      gcPlatformTinyPut("kozos_tema", "default");\n    }\n    PlatformConfigureFourThemeSelectors();\n    gcV38PrepareScreen1Extras();\n  }'''
          if old2 not in s: raise SystemExit('PlatformPrepareScreen1Ui pattern missing')
          s = s.replace(old2, new2, 1)
          old3 = '''  public void PlatformApplySavedThemeLayout() {\n    String theme = gcPlatformString(gcPlatformTinyGet("kozos_tema", "default"), "default");\n    String layout = gcPlatformString(gcPlatformTinyGet("kozos_layout", "CLASSIC"), "CLASSIC");\n    PlatformApplyThemeCode(theme);\n    PlatformApplyLayoutCode(layout);\n  }'''
          new3 = '''  public void PlatformApplySavedThemeLayout() {\n    String theme = gcPlatformString(gcPlatformTinyGet("kozos_tema", "default"), "default");\n    String layout = gcPlatformString(gcPlatformTinyGet("kozos_layout", "CLASSIC"), "CLASSIC");\n    PlatformApplyThemeCode(theme);\n    PlatformApplyLayoutCode(layout);\n    ProjectV2ApplyCurrentScreenUi();\n    gc284KeepProjectBarsWhite();\n  }'''
          if old3 not in s: raise SystemExit('PlatformApplySavedThemeLayout pattern missing')
          s = s.replace(old3, new3, 1)
          old4 = 'gcPlatformGetProperty(c, "Checked", Boolean.FALSE)'
          new4 = 'gcPlatformGetProperty(c, c instanceof com.google.appinventor.components.runtime.Switch ? "On" : "Checked", Boolean.FALSE)'
          if old4 not in s: raise SystemExit('Checkbox/switch pattern missing')
          s = s.replace(old4, new4, 1)
          old5 = 'if (inputs.length() > 18000 || results.length() > 18000) break;'
          if old5 not in s: raise SystemExit('capture cap pattern missing')
          s = s.replace(old5, 'if (inputs.length() > 8000 || results.length() > 8000) break;', 1)
          old6 = 'while (rows.size() > 3000) rows.remove(rows.size() - 1);'
          if old6 not in s: raise SystemExit('snapshot cap pattern missing')
          s = s.replace(old6, 'while (rows.size() > 600) rows.remove(rows.size() - 1);', 1)
          old7 = '''      gcSetProperty(label, "BackgroundColor", Integer.valueOf(p[1]));\n      gcSetProperty(label, "TextColor", Integer.valueOf("marka2".equals(gcPlatformString(gcPlatformTinyGet("kozos_tema","default"),"default")) ? 0xFF111111 : (p[1] == 0xFFF2F4F5 ? 0xFF111111 : 0xFFFFFFFF)));'''
          new7 = '''      gcSetProperty(label, "BackgroundColor", Integer.valueOf(0x00FFFFFF));\n      gcSetProperty(label, "TextColor", Integer.valueOf(0xFF111111));'''
          if old7 not in s: raise SystemExit('project label style pattern missing')
          s = s.replace(old7, new7, 1)
          old8 = '    gcV38Set(m,"BTN_MODULE_CLEAR_BACK","Text",gcV38L("BACK",l));'
          if old8 not in s: raise SystemExit('clear-language pattern missing')
          s = s.replace(old8, old8 + '\n    gc284ApplyModuleClearTexts(m,l);', 1)
          old9 = 'gcCApplyTexts(m);gcCApplyTheme(m);gcCTextSet(m,"LBL_GC_PageTitle",gcCPageTitle(gcCenterPage));'
          new9 = 'gcCApplyTexts(m);gcCApplyTheme(m);if("PROJECT".equals(gcCenterPage)){ProjectV2RefreshUi();gc284ApplyProjectFieldTexts(m,gcCLang());}gcCTextSet(m,"LBL_GC_PageTitle",gcCPageTitle(gcCenterPage));'
          if old9 not in s: raise SystemExit('center refresh pattern missing')
          s = s.replace(old9, new9, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Build AIX
        run: |
          cd buildenv
          ant clean extensions
      - name: Upload AIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: GateCraftCore-v42-runtime-v41-editor-compat-aix-build285-draw
          path: buildenv/out/*.aix
          if-no-files-found: error

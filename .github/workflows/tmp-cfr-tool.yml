name: tmp-cfr-tool
on:
  push:
    branches: [tmp-unused]
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download CFR
        run: |
          curl -L --fail --retry 3 -o /tmp/cfr.jar https://github.com/leibnitz27/cfr/releases/download/0.152/cfr-0.152.jar
          echo "f686e8f3ded377d7bc87d216a90e9e9512df4156e75b06c655a16648ae8765b2  /tmp/cfr.jar" | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: cfr-0.152
          path: /tmp/cfr.jar

name: Build GateCraftBilling v1 beta2

on:
  push:
    branches: [ gatecraft-billing-v1 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17 for Gradle dependency resolution
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Install App Inventor build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ant unzip zip

      - name: Clone official MIT App Inventor extension template
        run: |
          git clone --recurse-submodules https://github.com/mit-cml/extension-template.git buildbilling
          rm -rf buildbilling/src/*
          mkdir -p buildbilling/src/com/gatecraft/billing
          cp billing/GateCraftBilling.java buildbilling/src/com/gatecraft/billing/GateCraftBilling.java

      - name: Resolve Play Billing 9.1.0 runtime dependencies with Gradle
        run: |
          cat > buildbilling/settings.gradle <<'EOF'
          pluginManagement {
            repositories {
              gradlePluginPortal()
              google()
              mavenCentral()
            }
          }
          rootProject.name = 'gatecraft-billing-deps'
          EOF
          cat > buildbilling/build.gradle <<'EOF'
          plugins {
            id 'java'
            id 'com.github.johnrengelman.shadow' version '8.1.1'
          }
          repositories {
            google()
            mavenCentral()
          }
          configurations {
            billingRuntime
          }
          dependencies {
            billingRuntime 'com.android.billingclient:billing:9.1.0'
          }
          tasks.register('copyBillingDeps', Copy) {
            from configurations.billingRuntime
            into layout.projectDirectory.dir('depsraw')
          }
          tasks.register('shadeBilling', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
            archiveFileName = 'GateCraftBilling-shaded.jar'
            destinationDirectory = layout.buildDirectory.dir('shaded')
            from { zipTree(file('build/externalComponents-classes/com.gatecraft.billing.jar')) }
            configurations = []
            relocate 'com.android.billingclient', 'com.gatecraft.billing.repack.billingclient'
            relocate 'androidx', 'com.gatecraft.billing.repack.androidx'
            relocate('com.google', 'com.gatecraft.billing.repack.google') {
              exclude 'com.google.appinventor.**'
            }
            relocate 'kotlin', 'com.gatecraft.billing.repack.kotlin'
            relocate 'kotlinx', 'com.gatecraft.billing.repack.kotlinx'
            relocate 'org.jetbrains', 'com.gatecraft.billing.repack.jetbrains'
            relocate 'org.intellij', 'com.gatecraft.billing.repack.intellij'
            relocate 'javax.inject', 'com.gatecraft.billing.repack.javaxinject'
            relocate 'android.support', 'com.gatecraft.billing.repack.androidsupport'
            mergeServiceFiles()
            exclude 'META-INF/versions/**'
            exclude 'module-info.class'
            exclude 'META-INF/*.SF'
            exclude 'META-INF/*.RSA'
            exclude 'META-INF/*.DSA'
          }
          EOF
          cd buildbilling
          rm -rf depsraw
          gradle --no-daemon copyBillingDeps
          echo "Resolved artifacts:"
          find depsraw -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Convert AAR dependencies to extension JAR dependencies
        run: |
          set -euxo pipefail
          rm -rf buildbilling/lib/deps/*
          mkdir -p buildbilling/lib/deps /tmp/gcb-aar
          for f in buildbilling/depsraw/*; do
            base="$(basename "$f")"
            case "$base" in
              *.jar)
                cp "$f" "buildbilling/lib/deps/$base"
                ;;
              *.aar)
                name="${base%.aar}"
                rm -rf "/tmp/gcb-aar/$name"
                mkdir -p "/tmp/gcb-aar/$name"
                unzip -q "$f" -d "/tmp/gcb-aar/$name"
                if [ -f "/tmp/gcb-aar/$name/classes.jar" ]; then
                  cp "/tmp/gcb-aar/$name/classes.jar" "buildbilling/lib/deps/$name.jar"
                fi
                if [ -d "/tmp/gcb-aar/$name/libs" ]; then
                  for j in "/tmp/gcb-aar/$name"/libs/*.jar; do
                    [ -e "$j" ] || continue
                    cp "$j" "buildbilling/lib/deps/${name}-$(basename "$j")"
                  done
                fi
                ;;
            esac
          done
          for j in buildbilling/lib/deps/*.jar; do
            zip -q -d "$j" 'META-INF/versions/*' 'module-info.class' 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 2>/dev/null || true
          done
          ls -lh buildbilling/lib/deps

      - name: Inject App Inventor libraries and Billing manifest metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          depdir=Path('buildbilling/lib/deps')
          libs=','.join(sorted(p.name for p in depdir.glob('*.jar')))
          if not libs:
              raise SystemExit('No dependency jars resolved')
          p=Path('buildbilling/src/com/gatecraft/billing/GateCraftBilling.java')
          s=p.read_text(encoding='utf-8')
          if '__GCB_LIBS__' not in s:
              raise SystemExit('Library placeholder missing')
          s=s.replace('__GCB_LIBS__', libs)
          s=s.replace('version = 1,', 'version = 2,', 1)
          s=s.replace('import com.google.appinventor.components.annotations.UsesLibraries;\n',
              'import com.google.appinventor.components.annotations.UsesLibraries;\n'
              'import com.google.appinventor.components.annotations.UsesActivities;\n'
              'import com.google.appinventor.components.annotations.UsesApplicationMetadata;\n'
              'import com.google.appinventor.components.annotations.androidmanifest.ActivityElement;\n'
              'import com.google.appinventor.components.annotations.androidmanifest.MetaDataElement;\n')
          s=s.replace('    nonVisible = true,\n    iconName = "")',
              '    nonVisible = true,\n    iconName = "",\n    androidMinSdk = 21,\n    versionName = "1.0.0-beta2")')
          marker='@SimpleObject(external = true)'
          manifest='''@UsesActivities(activities = {\n    @ActivityElement(\n        name = "com.gatecraft.billing.repack.billingclient.api.ProxyBillingActivity",\n        configChanges = "keyboard|keyboardHidden|screenLayout|screenSize|orientation",\n        exported = "false",\n        theme = "@android:style/Theme.Translucent.NoTitleBar"),\n    @ActivityElement(\n        name = "com.gatecraft.billing.repack.billingclient.api.ProxyBillingActivityV2",\n        configChanges = "keyboard|keyboardHidden|screenLayout|screenSize|orientation",\n        exported = "false",\n        theme = "@android:style/Theme.Translucent.NoTitleBar")\n})\n@UsesApplicationMetadata(metaDataElements = {\n    @MetaDataElement(name = "com.google.android.play.billingclient.version", value = "9.1.0")\n})\n@SimpleObject(external = true)'''
          if marker not in s:
              raise SystemExit('SimpleObject marker missing')
          s=s.replace(marker,manifest,1)
          p.write_text(s, encoding='utf-8')
          print('UsesLibraries:', libs)
          PY

      - name: Set up Java 8 for App Inventor metadata and JAR build
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Build App Inventor extension metadata and merged runtime JAR
        run: |
          cd buildbilling
          java -version
          ant clean jarAllExtensions
          test -f build/externalComponents-classes/com.gatecraft.billing.jar
          test -f build/externalComponents/com.gatecraft.billing/files/AndroidRuntime.jar
          echo 'Generated manifest/build info:'
          cat build/externalComponents/com.gatecraft.billing/files/component_build_info.json || true

      - name: Set up Java 17 for shading and D8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Shade Billing dependencies while preserving App Inventor runtime
        run: |
          set -euxo pipefail
          cd buildbilling
          gradle --no-daemon shadeBilling
          test -f build/shaded/GateCraftBilling-shaded.jar
          cp build/shaded/GateCraftBilling-shaded.jar build/externalComponents/com.gatecraft.billing/files/AndroidRuntime.jar
          echo 'Unrelocated third-party classes remaining (App Inventor refs are expected):'
          jar tf build/shaded/GateCraftBilling-shaded.jar | grep -E '^(androidx/|kotlin/|kotlinx/|com/android/billingclient/|com/google/|org/jetbrains/|org/intellij/|javax/inject/|android/support/)' || true
          echo 'Required kept component:'
          jar tf build/shaded/GateCraftBilling-shaded.jar | grep '^com/gatecraft/billing/GateCraftBilling.class$'
          echo 'Required relocated proxy activities:'
          jar tf build/shaded/GateCraftBilling-shaded.jar | grep 'com/gatecraft/billing/repack/billingclient/api/ProxyBillingActivity'
          echo 'Checking App Inventor runtime references were NOT relocated:'
          if strings build/shaded/GateCraftBilling-shaded.jar | grep -q 'com/gatecraft/billing/repack/google/appinventor'; then
            echo 'ERROR: App Inventor runtime was incorrectly relocated'
            exit 1
          fi
          javap -classpath build/shaded/GateCraftBilling-shaded.jar -p com.gatecraft.billing.GateCraftBilling > /tmp/gcb-javap.txt
          cat /tmp/gcb-javap.txt | head -40
          grep -q 'com.google.appinventor.components.runtime.AndroidNonvisibleComponent' /tmp/gcb-javap.txt
          grep -q 'com.google.appinventor.components.runtime.OnResumeListener' /tmp/gcb-javap.txt
          grep -q 'com.google.appinventor.components.runtime.OnDestroyListener' /tmp/gcb-javap.txt
          grep -q 'com.google.appinventor.components.runtime.ComponentContainer' /tmp/gcb-javap.txt

      - name: Dex shaded extension with Android D8 and package AIX
        run: |
          set -euxo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          D8="$(find "$SDK/build-tools" -maxdepth 2 -type f -name d8 | sort -V | tail -1)"
          ANDROID_JAR="$(find "$SDK/platforms" -maxdepth 2 -type f -name android.jar | sort -V | tail -1)"
          test -x "$D8"
          test -f "$ANDROID_JAR"
          rm -rf /tmp/gcb-d8
          mkdir -p /tmp/gcb-d8
          "$D8" --min-api 21 --lib "$ANDROID_JAR" --output /tmp/gcb-d8 \
            buildbilling/build/shaded/GateCraftBilling-shaded.jar
          test -f /tmp/gcb-d8/classes.dex
          rm -f buildbilling/build/externalComponents/com.gatecraft.billing/classes.jar
          (cd /tmp/gcb-d8 && zip -q "$GITHUB_WORKSPACE/buildbilling/build/externalComponents/com.gatecraft.billing/classes.jar" classes.dex)
          mkdir -p buildbilling/out
          rm -f buildbilling/out/com.gatecraft.billing.aix
          (cd buildbilling/build/externalComponents && zip -qr "$GITHUB_WORKSPACE/buildbilling/out/com.gatecraft.billing.aix" com.gatecraft.billing)

      - name: Inspect final AIX and reject bad App Inventor repack
        run: |
          set -eux
          test -f buildbilling/out/com.gatecraft.billing.aix
          unzip -t buildbilling/out/com.gatecraft.billing.aix
          unzip -p buildbilling/out/com.gatecraft.billing.aix com.gatecraft.billing/classes.jar > /tmp/classes.jar
          unzip -t /tmp/classes.jar
          rm -rf /tmp/classesdex
          unzip -q -o /tmp/classes.jar -d /tmp/classesdex
          strings /tmp/classesdex/classes.dex | grep '9.1.0'
          strings /tmp/classesdex/classes.dex | grep 'GateCraftBilling'
          strings /tmp/classesdex/classes.dex | grep 'ProxyBillingActivity'
          if strings /tmp/classesdex/classes.dex | grep -q 'com/gatecraft/billing/repack/google/appinventor'; then
            echo 'ERROR: DEX still contains relocated App Inventor runtime references'
            exit 1
          fi
          strings /tmp/classesdex/classes.dex | grep 'Lcom/google/appinventor/components/runtime/OnResumeListener;'
          strings /tmp/classesdex/classes.dex | grep 'Lcom/google/appinventor/components/runtime/ComponentContainer;'
          echo 'Final AIX size:'
          ls -lh buildbilling/out/com.gatecraft.billing.aix
          echo 'Final component metadata:'
          cat buildbilling/build/externalComponents/com.gatecraft.billing/component.json
          echo 'Final component build info:'
          cat buildbilling/build/externalComponents/com.gatecraft.billing/files/component_build_info.json

      - name: Upload GateCraftBilling AIX
        uses: actions/upload-artifact@v4
        with:
          name: GateCraftBilling-v1-beta2-aix
          path: buildbilling/out/com.gatecraft.billing.aix
          if-no-files-found: error

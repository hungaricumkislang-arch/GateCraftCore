# GateCraftCore AIX build workflow v25 - brutal-build exact core + complete six-language MotorDiag
name: Build GateCraftCore AIX

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GateCraftCore
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Ant
        run: |
          sudo apt-get update
          sudo apt-get install -y ant

      - name: Get official MIT App Inventor extension template
        run: |
          git clone --recurse-submodules https://github.com/mit-cml/extension-template.git buildenv

      - name: Restore GateCraftCore v1 source bundle
        run: |
          rm -rf buildenv/src/*
          cat source_bundle/part*.txt | base64 --decode > /tmp/gatecraftcore-src.tar.gz
          tar -xzf /tmp/gatecraftcore-src.tar.gz -C buildenv/src
          find buildenv/src -maxdepth 8 -type f -print

      - name: Inject GateCraftCore v2.5 MotorDiag helpers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          matches = list(Path('buildenv/src').rglob('GateCraftCore.java'))
          if len(matches) != 1:
              raise SystemExit('Expected exactly one GateCraftCore.java, found %d' % len(matches))
          p = matches[0]
          s = p.read_text(encoding='utf-8')
          s = s.replace('version = 10', 'version = 25', 1)
          s = s.replace('return "1.0.0";', 'return "2.5.0";', 1)
          fragments = []
          for fp in [
              'extra_methods.javafrag', 'extra_names.javafrag', 'extra_algorithms.javafrag',
              'extra_railing.javafrag', 'extra_welding.javafrag', 'extra_defaults.javafrag',
              'extra_geo_missing3d.javafrag', 'extra_batch.javafrag', 'extra_lang_asset.javafrag',
              'extra_static_asset.javafrag', 'extra_textops_asset.javafrag', 'extra_langplan_asset.javafrag',
              'extra_motordiag.javafrag', 'extra_motordiag_userdata.javafrag', 'extra_motordiag_lang.javafrag']:
              fragments.append(Path(fp).read_text(encoding='utf-8'))
          pos = s.rfind('}')
          if pos < 0:
              raise SystemExit('Could not locate class closing brace')
          p.write_text(s[:pos] + '\n' + '\n'.join(fragments) + '\n' + s[pos:], encoding='utf-8')
          print('patched', p)
          PY

      - name: Build AIX
        run: |
          cd buildenv
          ant clean extensions

      - name: Show generated files
        run: |
          find buildenv/out -maxdepth 2 -type f -print

      - name: Upload AIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: GateCraftCore-v2.5-aix
          path: buildenv/out/*.aix
          if-no-files-found: error
